services:
  go2rtc:
    image: alexxit/go2rtc:1.9.7
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"       # API + web UI
      - "8554:8554"       # RTSP restream (recorder consumes this in Phase 2)
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"   # WebRTC

  cameras-setup:
    image: node:24-alpine
    working_dir: /workspace/cameras-setup
    env_file: .env
    volumes:
      - .:/workspace
      - cameras_setup_node_modules:/workspace/cameras-setup/node_modules
    command: sh -c "npm install && npm run setup"

  web-app:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      GO2RTC_URL: http://go2rtc:1984
    volumes:
      - ./web-app:/app
      - web_app_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - go2rtc

volumes:
  cameras_setup_node_modules:
  web_app_node_modules:
