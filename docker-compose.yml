services:
  go2rtc:
    image: alexxit/go2rtc:1.9.7
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"

  cameras-setup:
    image: node:24-alpine
    working_dir: /workspace/cameras-setup
    env_file: .env
    volumes:
      - .:/workspace
      - cameras_setup_node_modules:/workspace/cameras-setup/node_modules
    command: npm run setup

  server:
    build:
      context: ./server
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      GO2RTC_URL: http://go2rtc:1984
      RECORDINGS_PATH: /recordings
      DATA_PATH: /data
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - ./cameras.yml:/workspace/cameras.yml:ro
      - ${RECORDINGS_PATH}:/recordings
      - ${DATA_PATH}:/data
    ports:
      - "3000:3000"
    depends_on:
      - go2rtc
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-app:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      GO2RTC_URL: http://go2rtc:1984
      SERVER_URL: http://server:3000
    volumes:
      - ./web-app:/app
      - web_app_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - go2rtc
      - server

volumes:
  cameras_setup_node_modules:
  server_node_modules:
  web_app_node_modules:
