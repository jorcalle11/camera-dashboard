# Production stack: nginx (static UI + reverse proxy), server (API/recorder), go2rtc.
# go2rtc :1984 is not published — browsers reach it only via /go2rtc on nginx.
#
#   npm run setup
#   npm run prod
#   open http://localhost:8080   (or set HTTP_PORT in .env)
#
services:
  go2rtc:
    image: alexxit/go2rtc:1.9.7
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"

  server:
    build:
      context: ./server
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      GO2RTC_URL: http://go2rtc:1984
      RECORDINGS_PATH: /recordings
      DATA_PATH: /data
      CAMERAS_YML_PATH: /workspace/cameras.yml
    volumes:
      - ./cameras.yml:/workspace/cameras.yml:ro
      - ${RECORDINGS_PATH}:/recordings
      - ${DATA_PATH}:/data
    depends_on:
      - go2rtc
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ${RECORDINGS_PATH}:/recordings:ro
    depends_on:
      server:
        condition: service_healthy
      go2rtc:
        condition: service_started
