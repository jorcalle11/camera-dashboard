map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Recording MP4s (same paths as server static route; served here to avoid Node for large files)
  location /api/statics/recordings/ {
    alias /recordings/;
    add_header Accept-Ranges bytes;
  }

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /go2rtc/ {
    proxy_pass http://go2rtc:1984/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # go2rtc rejects WebSocket upgrades when Origin does not match its host
    proxy_set_header Origin http://go2rtc:1984;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
